# Critérios de relevância epidemiológica (pontuação por regras)
# A pontuação final soma: peso da fonte + agravo + eventos + localidade + ajustes.
# Os termos são comparados sem acentos e sem diferenciar maiúsculas.
# Pesos dos agravos: 5 = notificação imediata ou evento de potencial internacional,
# 3 a 4 = notificação compulsória com relevância de surto, 2 = interesse em saúde pública.
# icone: pictograma usado no PDF e no site (virus, mosquito, respiratorio, vacina, bacteria,
# fungo, agua, alerta, desastre, clima, quimico, animal, saude).

limiar_feed: 4            # pontuação mínima para aparecer no feed do site
limiar_clipping: 5        # pontuação mínima para concorrer aos destaques
penalidade_retrospectivo: -6   # título que cita só anos já encerrados (relato de evento passado)
piso_canal_alerta: 6           # pontuação mínima dos canais oficiais de alerta (fontes com canal_alerta: true)
# Termos com asterisco no fim valem como prefixo: "shigel*" casa shigella, shigelose, shigellosis.

agravos:
  - {nome: "Doença pelo vírus Ebola", icone: virus, peso: 5, termos: [ebola, bundibugyo, "sudan virus", "virus sudao"]}
  - {nome: "Doença de Marburg", icone: virus, peso: 5, termos: [marburg]}
  - {nome: "Febres hemorrágicas virais", icone: virus, peso: 5, termos: [lassa, "febre hemorragica", "hemorrhagic fever", "crimean-congo", cchf, "fiebre hemorragica"]}
  - {nome: "Patógeno novo ou incomum em humanos", icone: virus, peso: 5, termos: ["first human case", "first human cases", "first ever human", "first-ever human", "first human infection", "first human infections", "first human infected", "first reported human", "first known human", "primeiro caso humano", "primeiros casos humanos", "primeira infeccao humana", "primeiro registro em humanos", "primeira deteccao em humanos", "novo virus", "new virus", "novel virus", "novel pathogen", "virus emergente", "emerging virus", "emerging pathogen", "doenca emergente", "emerging disease", "evento inusitado", "unusual event", "agente etiologico desconhecido", shamonda, orthobunyavir*, "simbu virus", schmallenberg, akabane, usutu, mayaro, "virus andes", "andes virus", "andes hantavirus", "borna virus", bornavir*, "langya", "alongshan", "wetland virus", "tick-borne virus"]}
