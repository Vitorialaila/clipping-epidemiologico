eventos:
  - {peso: 3, termos: ["emergencia de saude publica", "public health emergency", pheic, espii, "emergency committee", "comite de emergencia", "regulamento sanitario internacional", "international health regulations"]}
  - {peso: 2.5, termos: [surto, surtos, outbreak, outbreaks, brote, brotes, epidemia, epidemic, "disease outbreak news", cluster, conglomerado]}
  - {peso: 2, termos: ["alerta epidemiologico", "epidemiological alert", "health alert", "atualizacao epidemiologica", "epidemiological update", "alerta sanitario", "rapid risk assessment", "avaliacao de risco", "risk assessment", "threat assessment"]}
  - {peso: 2, termos: ["primeiro caso", "primeiros casos", "first case", "first cases", "primer caso", autoctone, autochthonous, "caso importado", "imported case", "transmissao local", "local transmission", reintroducao, reintroduction, "caso confirmado", "confirmed case", "casos confirmados", "confirmed cases"]}
  - {peso: 1.5, termos: [obito, obitos, death, deaths, fatal, fatalities, muertes, letalidade, "case fatality"]}
  - {peso: 1, termos: ["aumento de casos", "increase in cases", "rising cases", surge, "alta de casos", "estado de emergencia", "situacao de emergencia", "emergencia em saude publica"]}
  - {peso: 1, termos: [vigilancia, surveillance, notificacao, notification, investigacao, investigation, "boletim epidemiologico"]}

