ajustes:
  # Estudos, pesquisas e avaliações de efetividade (não são ocorrência nova)
  - {peso: -3, termos: [estudo, estudos, pesquisa, pesquisas, pesquisadores, study, studies, researchers, artigo, "ensaio clinico", "clinical trial", efetividade, effectiveness, metodologia, "knowledge, attitudes", "knowledge attitudes", "vaccine effectiveness", "estimates of", "interim estimates", "vaccination coverage among", "cobertura vacinal entre"]}
