# Expressões removidas do texto antes da comparação: sentido figurado ou outro assunto
exclusoes: ["lei seca", "a seco", "tosse seca", "pele seca", "boca seca", "olho seco", "olhos secos", "cortina de fumaca", "fumaca branca", "fumaca preta", "marco temporal", "serie temporal", "series temporais", "evolucao temporal", "analise temporal", "recorte temporal", "janela temporal", "lobo temporal", "tempestade perfeita", "tempestade politica", "desastre politico", "desastre eleitoral", "terremoto politico", "onda de calor nas pesquisas", "temporada de premios", "vacina contra a crise", "virus da corrupcao", "epidemia de fake news", "surto de otimismo", "surto de confianca", "aids ao", "first aid", "hearing aids"]

eventos:
  # Ocorrência concreta de desastre ou evento climático com impacto na população
  - {peso: 2.5, termos: [alagamento, alagamentos, alagada, alagadas, enchente, enchentes, inundacao, inundacoes, desabrigados, desalojados, estragos, destruicao, desabamento, deslizamento, deslizamentos, "queda de arvores", "arvores caidas", granizo, vendaval, "estado de calamidade", "situacao de emergencia", "onda de calor", "baixa umidade"]}
  # Atualização da situação: boletins, informes e alertas oficiais (o que mudou na semana)
  - {peso: 2, termos: [boletim, "informe epidemiologico", "nota tecnica", "nota informativa", infogripe, "nivel de alerta", "nivel de risco", tendencia, "situacao epidemiologica", "cenario epidemiologico", "alerta para", "emite alerta", "aviso meteorologico", "alerta meteorologico", previsao]}
  - {peso: 3, termos: ["emergencia de saude publica", "public health emergency", pheic, espii, "emergency committee", "comite de emergencia", "regulamento sanitario internacional", "international health regulations"]}
  - {peso: 2.5, termos: [surto, surtos, outbreak, outbreaks, brote, brotes, epidemia, epidemic, "disease outbreak news", cluster, conglomerado]}
  - {peso: 2, termos: ["alerta epidemiologico", "epidemiological alert", "health alert", "atualizacao epidemiologica", "epidemiological update", "alerta sanitario", "rapid risk assessment", "avaliacao de risco", "risk assessment", "threat assessment"]}
  - {peso: 2, termos: ["primeiro caso", "primeiros casos", "first case", "first cases", "first ever", "first-ever", "human infection", "infeccao humana", "human case", "caso humano", "casos humanos", "human cases", "primer caso", autoctone, autochthonous, "caso importado", "imported case", "transmissao local", "local transmission", reintroducao, reintroduction, "caso confirmado", "confirmed case", "casos confirmados", "confirmed cases"]}
  - {peso: 1.5, termos: [obito, obitos, death, deaths, fatal, fatalities, muertes, letalidade, "case fatality"]}
  - {peso: 1, termos: ["aumento de casos", "increase in cases", "rising cases", surge, "alta de casos", "estado de emergencia", "situacao de emergencia", "emergencia em saude publica"]}
  - {peso: 1, termos: [vigilancia, surveillance, notificacao, notification, investigacao, investigation, "boletim epidemiologico"]}

