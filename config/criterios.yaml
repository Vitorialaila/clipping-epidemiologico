# Critérios de relevância epidemiológica (pontuação por regras)
# A pontuação final soma: peso da fonte + agravo + eventos + localidade + ajustes.
# Os termos são comparados sem acentos e sem diferenciar maiúsculas.
# Pesos dos agravos: 5 = notificação imediata ou evento de potencial internacional,
# 3 a 4 = notificação compulsória com relevância de surto, 2 = interesse em saúde pública.
# icone: pictograma usado no PDF e no site (virus, mosquito, respiratorio, vacina, bacteria,
# fungo, agua, alerta, desastre, clima, quimico, animal, saude).

limiar_feed: 4            # pontuação mínima para aparecer no feed do site
limiar_clipping: 5        # pontuação mínima para concorrer aos destaques
penalidade_retrospectivo: -6   # título que cita só anos já encerrados (relato de evento passado)
piso_canal_alerta: 6           # pontuação mínima dos canais oficiais de alerta (fontes com canal_alerta: true)

# Categorias de relevância exibidas no site (Alerta, Atenção, Monitoramento). lnnc = periodicidade de notificação
# do agravo na Lista Nacional de Notificação Compulsória (Portaria GM/MS nº 6.734/2025): imediata (até 24 horas),
# semanal ou nao (fora da lista); desastre = eventos climáticos e desastres. lnnc_obito: o óbito é de notificação imediata.
categorias:
  # Ocorrência concreta do agravo (o que distingue um evento de uma notícia sobre o tema)
  ocorrencia: [surto, surtos, outbreak, outbreaks, brote, brotes, epidemia, epidemic, cluster, conglomerado, "caso confirmado", "casos confirmados", "confirmed case", "confirmed cases", "primeiro caso", "primeiros casos", "first case", "first cases", "first ever", "first-ever", "caso humano", "casos humanos", "human case", "human cases", "human infection", "infeccao humana", "transmissao local", "local transmission", autoctone, autoctones, autochthonous, "caso importado", "casos importados", "imported case", "imported cases", "aumento de casos", "increase in cases", "alta de casos", "novos casos", "new cases", "additional cases", confirmation, confirmed, confirma, confirmam, confirmado, confirmada, "primer caso", disparam, dispara, spread, spreads, spreading, "se espalha", "se espalham", avanca, avancam, emerge, emergem, raging, obito, obitos, death, deaths, morte, mortes, morre, morrem, morreu, morreram, fatal, infectadas, infectados, "suspendem aulas", "suspende aulas", "aulas suspensas", "aulas sao suspensas", foco, focos, epizootia, epizootias]
  # Óbito, para os agravos cujo óbito é de notificação imediata (dengue, chikungunya, zika, varicela)
  obito: [obito, obitos, death, deaths, morte, mortes, morre, morrem, morreu, morreram, fatal]
  # Impacto concreto de desastre na população
  impacto_desastre: [alagamento, alagamentos, alagada, alagadas, enchente, enchentes, inundacao, inundacoes, desabrigados, desalojados, desabamento, deslizamento, deslizamentos, "situacao de emergencia", "estado de calamidade", "calamidade publica", "decreta emergencia", "reconhece emergencia", "reconhecida emergencia", mortos, feridos, "atendimentos respiratorios", "qualidade do ar critica", "qualidade do ar perigosa", atinge, atingem, atingida, atingidas, atingido, atingidos, estragos, destruicao, danos, rastros, "queda de arvores", "arvores caidas", "sem energia", transborda, arrastados, desabam, desabou]
  # Previsão, aviso ou orientação: não é impacto ocorrido (salvo se o título também relatar o impacto)
  previsao: ["alerta para", "alerta sobre", "emite alerta", "renova alerta", "em alerta", "sob alerta", previsao, preve, "pode chegar", "podem chegar", "possibilidade de", "risco de", "riscos de", orienta, "como se proteger", "veja como", "cuidados"]
  # Situação epidemiológica de agravo de notificação imediata, mesmo sem ocorrência nova no título
  situacao: [boletim, "cenario epidemiologico", "situacao epidemiologica", "informe", reintroducao, "risco de reintroducao", "nota tecnica", "nota informativa", tendencia, "nivel de alerta", ameaca, threat, risco, risk, pandemia, pandemic]
  # Título que caracteriza um alerta ou avaliação de risco oficial
  titulo_alerta: [alert, alerta, "risk assessment", "threat assessment", "avaliacao de risco", "disease outbreak news"]
# Termos com asterisco no fim valem como prefixo: "shigel*" casa shigella, shigelose, shigellosis.

