# Critérios de relevância epidemiológica (pontuação por regras)
# A pontuação final soma: peso da fonte + agravo + eventos + localidade + ajustes.
# Os termos são comparados sem acentos e sem diferenciar maiúsculas.
# Pesos dos agravos: 5 = notificação imediata ou evento de potencial internacional,
# 3 a 4 = notificação compulsória com relevância de surto, 2 = interesse em saúde pública.

limiar_feed: 4            # pontuação mínima para aparecer no feed do site
limiar_clipping: 5        # pontuação mínima para concorrer aos destaques

agravos:
  - {nome: "Doença pelo vírus Ebola", peso: 5, termos: [ebola, bundibugyo, "sudan virus", "virus sudao"]}
  - {nome: "Doença de Marburg", peso: 5, termos: [marburg]}
  - {nome: "Febres hemorrágicas virais", peso: 5, termos: [lassa, "febre hemorragica", "hemorrhagic fever", "crimean-congo", cchf, "fiebre hemorragica"]}
  - {nome: "Sarampo", peso: 5, termos: [sarampo, measles, sarampion]}
  - {nome: "Rubéola", peso: 4, termos: [rubeola, rubella, "sindrome da rubeola congenita"]}
  - {nome: "Poliomielite", peso: 5, termos: [poliomielite, polio, poliovirus, "paralisia flacida aguda", "acute flaccid paralysis", cvdpv, wpv1]}
