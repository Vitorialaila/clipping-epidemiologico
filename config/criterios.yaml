# Termos que indicam conteúdo sem ocorrência nova (institucional, estudos, programas, explicativos)
ajustes:
  # Estudos, pesquisas e avaliações de efetividade (não são ocorrência nova)
  - {peso: -3, termos: [estudo, estudos, pesquisa, pesquisas, pesquisadores, study, studies, researchers, artigo, "ensaio clinico", "clinical trial", efetividade, effectiveness, metodologia, "knowledge, attitudes", "knowledge attitudes", "vaccine effectiveness", "estimates of", "interim estimates", "vaccination coverage among", "cobertura vacinal entre"]}
  # Institucional: capacitações, eventos, programas, cooperação, estratégias e ferramentas
  - {peso: -5, termos: [seminario, capacitacao, capacita, capacitar, oficina, treinamento, "dia mundial", "dia nacional", mutirao, implantacao, implanta, implantada, implantado, lancamento, lanca, lancado, lancada, launches, launched, intensifica, "pede apoio", mobilizacao, cooperacao, parceria, partnership, "acordo de cooperacao", "assina acordo", "assinam acordo", "assina memorando", "memorando de entendimento", "signs agreement", "sign agreement", "signed an agreement", fortalece, fortalecer, fortalecimento, strengthen, strengthening, strengthens, "steps up", "good practices", "boas praticas", framework, estrategia, strategy, roadmap, toolkit, "plano de acao", "action plan", "observatorio", observatory, "governance", governanca, accreditation, credenciamento, "outcome statement", treinar, treina, "cria comite", "cria grupo de trabalho", enrollment, "expanding enrollment", congresso, forum, cupula, summit, "consulta publica", "public consultation", orientacao aos gestores, "orienta gestores"]}
  # Relatos retrospectivos do MMWR (CDC)
  - {peso: -2, termos: ["notes from the field"]}
  # Matérias explicativas: perdem menos, porque às vezes trazem um dado novo no título
  - {peso: -3, termos: [entenda, saiba, "tire duvidas", mitos, "diz especialista", "dizem especialistas", "what to know", explainer, "protect yourself", proteja-se, "cold season", "respiratory infections season", dicas, tips]}
  - {peso: -4, termos: [licitacao, "call for tenders", procurement, vacancy, vacancies, "job opening", concurso, "processo seletivo", edital]}
  - {peso: -2, termos: [webinar, podcast, nomeacao, appointed, "director-general candidates", posse, inauguracao, inaugura, aniversario, anniversary, curso, course, "save the date"]}
  # Política eleitoral e promessas de campanha (no título)
  - {peso: -5, termos: ["se for eleito", "se for eleita", "se eleito", "se eleita", candidato, candidata, candidatos, "campanha eleitoral", promete, prometem, "debate eleitoral"]}
  # Prêmios, homenagens, loterias e serviços: fora do escopo do clipping
  - {peso: -10, termos: [premio, premios, premiacao, premiado, premiada, premiados, finalista, finalistas, award, awards, prize, homenagem, homenageado, homenageada, "mega-sena", loteria, lotofacil, "como se cadastrar", "veja como se cadastrar"]}
  # Recomendações clínicas, aprovações de produtos e diretrizes (não são ocorrência)
