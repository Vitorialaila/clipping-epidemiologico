# Configuração geral do Clipping Epidemiológico
# Edite este arquivo diretamente no GitHub para ajustar o comportamento.

publicacao:
  titulo: "Clipping Epidemiológico"
  subtitulo: "Sala de Situação de Saúde - UnB | Residência de Vigilância em Saúde"
  # Instituições responsáveis, exibidas no cabeçalho e no bloco "Realização"
  # Autoria: aparece apenas no rodapé do site, como "Elaboração"; nunca nos PDFs nem no topo do site
  autoria: "Vitória Laila Ferreira Mendes Chagas"
  instituicoes:
    - "Sala de Situação de Saúde - UnB"
    - "Residência de Vigilância em Saúde"
  # Texto exibido no rodapé do PDF e do site (deixe vazio para omitir)
  rodape: ""

ia:
  # Provedor: gemini (plano gratuito do Google, chave GEMINI_API_KEY)
  # ou anthropic (API paga do Claude, chave ANTHROPIC_API_KEY)
  provedor: gemini
  # Modelos em ordem de preferência: se um estiver indisponível ou sem cota, usa o seguinte
  modelos_triagem: [gemini-3.5-flash-lite, gemini-3.1-flash-lite, gemini-flash-lite-latest]
  modelos_resumo: [gemini-3.8-flash, gemini-3.6-flash, gemini-flash-latest, gemini-3.5-flash-lite]
  # Intervalo mínimo entre chamadas, para respeitar o limite por minuto do plano gratuito
  pausa_segundos: 7
  # Quantas notícias da semana passam pela triagem da IA
  candidatos_triagem: 40
  # Nota mínima da IA (0 a 10) para uma notícia entrar nos destaques
  nota_minima: 5

clipping:
  # Número de notícias resumidas por edição
  destaques: 10
  # Máximo de destaques sobre o mesmo agravo (evita repetir o mesmo evento)
  max_por_agravo: 2
  # Nota mínima para as vagas sem garantia de tema: se nenhuma notícia alcançar, o clipping sai com menos
  # destaques em vez de completar com notícias fracas (vale para a seleção por regras, sem IA)
  nota_minima_livre: 8
  # Notícias adicionais sem resumo (não aparecem no PDF; ficam só nos dados da edição)
  outras_noticias: 12
  # Vagas garantidas: o clipping responde "com o que devo me preocupar?". Se houver notícia com nota
  # mínima sobre o tema na semana, a melhor delas entra nos destaques antes das demais.
  cotas:
    - {nome: "Distrito Federal", escopo: [DF], minimo: 2}
    - {nome: "Vírus respiratórios e SRAG", agravos: ["Influenza e vírus respiratórios", "COVID-19", "Síndrome respiratória e coronavírus emergentes", "Influenza por novo subtipo"], minimo: 1}
    - {nome: "Clima e desastres", agravos: ["Saúde ambiental e clima", "Emergências e desastres"], minimo: 1}
    - {nome: "El Niño", termos: ["el nino", "la nina"], minimo: 1}
    - {nome: "Sarampo", agravos: ["Sarampo"], minimo: 1}
  # Agravos tratados como um só grupo no limite por agravo (máximo de destaques do grupo)
  grupos:
    - {nome: "Clima e desastres", agravos: ["Saúde ambiental e clima", "Emergências e desastres"], maximo: 3}

imagens:
  # Fotos das notícias só são usadas quando a fonte publica sob licença que permite reutilização.
  # As licenças abaixo foram verificadas no rodapé de cada portal. A licença SemDerivações (ND)
  # exige crédito e proíbe alterações, por isso a foto é exibida inteira, sem recorte.
  # Para incluir outra fonte, confirme a licença antes de acrescentá-la aqui.
  fotos_licenciadas:
    - {dominio: "gov.br/saude", licenca: "CC BY-ND 3.0", credito: "Ministério da Saúde"}
    - {dominio: "gov.br/anvisa", licenca: "CC BY-ND 3.0", credito: "Anvisa"}
  # Sem foto liberada, o destaque recebe um mapa de localização ou, se não houver local, um pictograma.

site:
  # Dias de notícias exibidos no feed do site
  dias_feed: 90

coleta:
  # Dias de histórico mantidos na base (data/noticias.json)
  dias_retencao: 400
  timeout_segundos: 30

# Fontes oficiais monitoradas
# tipo: rss | who_api | html
# peso: relevância da fonte na pontuação (0 a 3)
# escopo_padrao: usado quando o texto não indica a localidade
# padrao_link (somente html): expressão regular que identifica links de notícias
fontes:
  - id: oms-don
    nome: "OMS | Disease Outbreak News"
    sigla: "OMS"
    tipo: who_api
    url: "https://www.who.int/api/news/diseaseoutbreaknews?sf_culture=en&$orderby=PublicationDateAndTime%20desc&$top=30"
    base_link: "https://www.who.int/emergencies/disease-outbreak-news/item/"
    peso: 3
    canal_alerta: true  # canal oficial de alerta: cada item é um evento (piso de pontuação)
    idioma: en

  - id: oms-noticias
    nome: "OMS | Notícias"
    sigla: "OMS"
    tipo: who_api
    url: "https://www.who.int/api/news/newsitems?sf_culture=en&$orderby=PublicationDateAndTime%20desc&$top=40"
    base_link: "https://www.who.int/news/item"
    peso: 1
    idioma: en

  - id: opas-alertas
    nome: "OPAS | Alertas e atualizações epidemiológicas"
    sigla: "OPAS"
    tipo: html
    url: "https://www.paho.org/en/epidemiological-alerts-and-updates"
    padrao_link: "paho\\.org/en/documents/epidemiological-(alert|update)"
    peso: 3
    canal_alerta: true  # canal oficial de alerta: cada item é um evento (piso de pontuação)
    escopo_padrao: "Américas"
    idioma: en

  - id: opas-noticias
    nome: "OPAS | Notícias"
    sigla: "OPAS"
    tipo: rss
    url: "https://www.paho.org/en/rss.xml"
    peso: 1.5
    escopo_padrao: "Américas"
    idioma: en

  - id: ecdc-cdtr
    nome: "ECDC | Communicable Disease Threats Report"
    sigla: "ECDC"
    tipo: rss
    url: "https://www.ecdc.europa.eu/en/taxonomy/term/1505/feed"
    peso: 2
    canal_alerta: true  # canal oficial de alerta: cada item é um evento (piso de pontuação)
    idioma: en

  - id: ecdc-atualizacoes
    nome: "ECDC | Epidemiological updates"
    sigla: "ECDC"
    tipo: rss
    url: "https://www.ecdc.europa.eu/en/taxonomy/term/1310/feed"
    peso: 2
    canal_alerta: true  # canal oficial de alerta: cada item é um evento (piso de pontuação)
    idioma: en

  - id: ecdc-avaliacoes
    nome: "ECDC | Risk assessments"
    sigla: "ECDC"
    tipo: rss
    url: "https://www.ecdc.europa.eu/en/taxonomy/term/1295/feed"
    peso: 2
    canal_alerta: true  # canal oficial de alerta: cada item é um evento (piso de pontuação)
    idioma: en

  - id: ecdc-noticias
    nome: "ECDC | News"
    sigla: "ECDC"
    tipo: rss
    url: "https://www.ecdc.europa.eu/en/taxonomy/term/1307/feed"
    peso: 1
    idioma: en

  - id: cdc-mmwr
    nome: "CDC | MMWR"
    sigla: "CDC"
    tipo: rss
    url: "https://tools.cdc.gov/api/v2/resources/media/342778.rss"
    peso: 0.5  # publicação científica semanal, com relatos retrospectivos: pesa menos que alertas
    so_titulo: true  # o resumo do RSS traz o sumário da edição inteira; avaliar só pelo título
    idioma: en

  - id: africa-cdc
    nome: "Africa CDC | Notícias"
    sigla: "Africa CDC"
    tipo: rss
    url: "https://africacdc.org/news-item/feed/"
    peso: 1.5
    idioma: en

  - id: ms-noticias
    nome: "Ministério da Saúde | Notícias"
    sigla: "MS"
    tipo: html
    url: "https://www.gov.br/saude/pt-br/assuntos/noticias"
    padrao_link: "gov\\.br/saude/pt-br/assuntos/noticias(-ms)?/\\d{4}/[a-z-]+/[a-z0-9-]{12,}"
    peso: 1.5
    escopo_padrao: "Brasil"
    idioma: pt

  - id: fiocruz
    nome: "Agência Fiocruz de Notícias"
    sigla: "Fiocruz"
    tipo: rss
    url: "https://agencia.fiocruz.br/rss.xml"
    peso: 1
    escopo_padrao: "Brasil"
    idioma: pt

  - id: agencia-brasil-saude
    nome: "Agência Brasil | Saúde"
    sigla: "Agência Brasil"
    tipo: rss
    url: "https://agenciabrasil.ebc.com.br/rss/saude/feed.xml"
    peso: 1.5
    escopo_padrao: "Brasil"
    idioma: pt

  - id: ses-go
    nome: "SES-GO | Notícias"
    sigla: "SES-GO"
    tipo: rss
    url: "https://goias.gov.br/saude/feed/"
    peso: 1.5
    escopo_padrao: "Brasil"
    idioma: pt

  - id: agencia-brasil-geral
    nome: "Agência Brasil | Geral"
    sigla: "Agência Brasil"
    tipo: rss
    url: "https://agenciabrasil.ebc.com.br/rss/geral/feed.xml"
    peso: 1
    escopo_padrao: "Brasil"
    idioma: pt

  # G1: busca no índice do Google Notícias restrita ao g1.globo.com (os RSS de editoria do G1
  # devolvem matérias antigas). Só entram as notícias com relevância pelos critérios de pontuação.
  - id: g1-busca
    ativo: false  # desativado em 22/10/2026: trazia muitos alertas de tempo e passava de metade do feed
    nome: "G1 | Busca de saúde e eventos"
    sigla: "G1"
    tipo: google_news
    dominios_permitidos: ["g1.globo.com"]
    nomes_fontes: {"g1.globo.com": "G1"}
    consultas:
      - "site:g1.globo.com surto OR epidemia OR casos confirmados OR óbitos"
      - "site:g1.globo.com sarampo OR dengue OR chikungunya OR oropouche OR febre amarela OR coqueluche"
      - "site:g1.globo.com gripe OR SRAG OR covid OR influenza aviária OR mpox OR meningite"
      - "site:g1.globo.com vírus OR bactéria OR infecção OR vigilância epidemiológica"
      - "site:g1.globo.com/df saúde OR dengue OR surto OR chuva OR incêndio"
      - "site:g1.globo.com Defesa Civil alerta OR alagamento OR enchente OR queimadas"
    dias: 7
    peso: 1
    escopo_padrao: "Brasil"
    idioma: pt

  # Sinais precoces na imprensa: notícias que costumam sair antes dos canais oficiais (ex.: surtos nos EUA).
  # Só entram as que têm relevância epidemiológica pelos critérios de pontuação.
  - id: cnn-brasil-saude
    nome: "CNN Brasil | Saúde"
    sigla: "CNN Brasil"
    tipo: html
    url: "https://www.cnnbrasil.com.br/saude/"
    padrao_link: "cnnbrasil\\.com\\.br/saude/[a-z0-9-]{20,}/?$"
    peso: 1
    apenas_relevantes: true
    idioma: pt

  - id: cnn-saude
    nome: "CNN | Health"
    sigla: "CNN"
    tipo: html
    url: "https://edition.cnn.com/health"
    padrao_link: "cnn\\.com/20\\d{2}/\\d{2}/\\d{2}/(health|us|world|americas|africa|asia|europe)/[a-z0-9-]{12,}"
    peso: 1
    apenas_relevantes: true
    idioma: en

  # Busca na CNN internacional pelo índice do Google Notícias (a página de saúde da CNN traz poucos links por vez)
  - id: cnn-busca
    nome: "CNN | Busca de surtos"
    sigla: "CNN"
    tipo: google_news
    regiao: "hl=en-US&gl=US&ceid=US:en"
    dominios_permitidos: ["cnn.com"]
    nomes_fontes: {"cnn.com": "CNN"}
    consultas:
      - "site:cnn.com measles OR outbreak OR epidemic"
      - "site:cnn.com bird flu OR H5N1 OR mpox OR ebola OR dengue OR cholera"
      - "site:cnn.com CDC cases OR virus OR infections"
    dias: 7
    peso: 1
    idioma: en

  # Clima e desastres (alertas de chuvas, calor, seca e El Niño)
  - id: inmet
    nome: "INMET | Notícias"
    sigla: "INMET"
    tipo: html
    url: "https://portal.inmet.gov.br/noticias"
    padrao_link: "portal\\.inmet\\.gov\\.br/noticias/[^/?#]{15,}"
    peso: 1
    apenas_relevantes: true
    escopo_padrao: "Brasil"
    idioma: pt

  - id: cemaden
    nome: "Cemaden | Notícias"
    sigla: "Cemaden"
    tipo: html
    url: "https://www.gov.br/cemaden/pt-br"
    padrao_link: "gov\\.br/cemaden/pt-br/(assuntos/[a-z-]+/)?[a-z0-9-]{35,}/?$"
    peso: 1
    apenas_relevantes: true
    escopo_padrao: "Brasil"
    idioma: pt

  # Defesa Civil: nacional (MIDR) e dos estados e do DF. Os portais bloqueiam parte do acesso automatizado,
  # por isso a busca também passa pelo Google Notícias, aceitando só domínios .gov.br.
  - id: defesa-civil-nacional
    nome: "Defesa Civil Nacional | MIDR"
    sigla: "Defesa Civil"
    tipo: rss
    url: "https://www.gov.br/mdr/pt-br/noticias/RSS"
    ativo: false  # o feed não devolve itens para robôs; as notícias do MIDR chegam pela busca abaixo
    peso: 1
    apenas_relevantes: true
    escopo_padrao: "Brasil"
    idioma: pt

  - id: defesa-civil-busca
    nome: "Defesa Civil | Alertas e ocorrências"
    sigla: "Defesa Civil"
    tipo: google_news
    dominios_permitidos: [".gov.br"]
    nomes_fontes: {"df.gov.br": "Defesa Civil DF", "gov.br": "Defesa Civil"}
    consultas:
      - "\"Defesa Civil\" Distrito Federal"
      - "\"Defesa Civil\" alerta chuvas OR calor OR seca OR incêndio"
      - "\"Defesa Civil Nacional\""
    dias: 7
    peso: 1
    escopo_padrao: "Brasil"
    idioma: pt

  # Notícias locais do Distrito Federal (os portais do GDF bloqueiam o acesso automatizado)
  - id: correio-braziliense-df
    nome: "Correio Braziliense | Cidades DF"
    sigla: "Correio Braziliense"
    tipo: html
    url: "https://www.correiobraziliense.com.br/cidades-df/"
    padrao_link: "correiobraziliense\\.com\\.br/cidades-df/\\d{4}/\\d{2}/\\d+-[a-z0-9-]+\\.html"
    peso: 1
    escopo_padrao: "DF"
    idioma: pt
